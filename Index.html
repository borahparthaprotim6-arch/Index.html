<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday!</title>
    <style>
        /* General page styling and centered flexbox */
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
        }
        
        /* Modern glass-like card container */
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
        }

        h1 {
            color: #ff4b4b;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        p {
            color: #555;
            font-size: 1.2em;
            line-height: 1.5;
        }

        /* Interactive button styling */
        button {
            background-color: #ff4b4b;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2em;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s, background-color 0.2s;
        }

        button:hover {
            background-color: #ff3333;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Happy Birthday! 🎂</h1>
        <!-- Customize your birthday message here -->
        <p>Wishing you a fantastic day filled with joy, laughter, and lots of cake!</p>
        <button id="confettiBtn">Click for a Surprise!</button>
    </div>

    <!-- Import the Canvas Confetti library from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <script>
        // Trigger a targeted confetti burst when the button is clicked
        document.getElementById('confettiBtn').addEventListener('click', () => {
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#ff4b4b', '#ff9a9e', '#fecfef', '#ffffff', '#ffd700']
            });
        });

        // Trigger an automatic confetti drop 0.5 seconds after the page loads
        window.onload = () => {
            setTimeout(() => {
                confetti({
                    particleCount: 100,
                    spread: 100,
                    origin: { y: 0.3 }
                });
            }, 500);
        };
    </script>
</body>
</html>
